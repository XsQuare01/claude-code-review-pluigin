name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate rule consistency
        run: node scripts/validate-rules.mjs
      - name: Run unit tests
        run: node --test tests/*.test.mjs

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require a version bump when shipped content changes
        run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"
